<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haritalar · CS2 · Babuşlar</title>
  <meta name="description" content="CS2 haritaları: infolar (callout'lar) ve smoke, molotof, flash videoları.">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../"><span>Babuşlar</span></a>
      <nav class="nav" aria-label="Ana menü">
        <a href="../">Ana sayfa</a>
        <a href="../lol/">League of Legends</a>
        <a href="./" aria-current="page">CS2</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title">CS2 haritaları</h1>
      <p class="page-sub">Bir harita seç; infoları radar üzerinde, smoke, molotof ve flash atışlarını videolu gör.</p>
      <div class="games" id="maps"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Babuşlar, Valve Corporation ile bağlantılı değildir. Counter-Strike 2 ve harita görüntüleri Valve Corporation'a aittir.</p>
    </div>
  </footer>

  <script src="../assets/common.js"></script>
  <script src="maps.js"></script>
  <script>
    document.getElementById("maps").replaceChildren(
      ...CS2_MAPS.map((map) =>
        el(
          "a",
          { class: "game-card", href: `harita.html?id=${map.id}` },
          el("img", { class: "card-img", src: map.radar, alt: "" }),
          el("span", { class: "badge" }, "İnfolar · Smoke ve flash videoları"),
          el("h2", {}, map.name),
          el("p", {}, map.summary)
        )
      )
    );
  </script>
</body>
</html>
